<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { scr: 0, story: 0, sound: false, fill: 0, hintSeen: false };
  scrollRef = React.createRef(); introRef = React.createRef(); nameRef = React.createRef(); cutRef = React.createRef(); bgRef = React.createRef(); barsRef = React.createRef();
  DUR = 6000;

  componentDidMount() {
    document.documentElement.classList.add('ready');
    this.camFx();
    this.runIntro();
    let last = performance.now();
    const loop = (now) => {
      const dt = now - last; last = now;
      if (this.state.scr === 2 && !this.paused && this.state.hintSeen) {
        this.elapsed = (this.elapsed || 0) + dt;
        const k = Math.min(1, this.elapsed / this.DUR);
        const bars = this.barsRef.current;
        if (bars && bars.children[this.state.story]) bars.children[this.state.story].firstChild.style.width = `${k * 100}%`;
        if (k >= 1 && this.state.story < 5) this.goStory(this.state.story + 1);
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    setTimeout(() => this.syncVideos(), 400);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  componentDidUpdate() { this.syncVideos(); }

  syncVideos() {
    const root = this.scrollRef.current; if (!root) return;
    const { scr, story, sound } = this.state;
    root.querySelectorAll('video-slot[data-vid]').forEach((vs) => {
      const v = vs.v; if (!v) return;
      const key = vs.getAttribute('data-vid');
      const active = (scr === 1 && key === 'reel') || (scr === 2 && key === 'fmt' + story);
      v.muted = !(active && sound);
      vs.hold = !active; vs.tryPlay();
    });
  }

  goStory(i) {
    if (i > 5) {
      const r = this.scrollRef.current;
      if (r) r.scrollTo({ top: 3 * r.clientHeight, behavior: 'smooth' });
      return;
    }
    if (i < 0) return;
    const n = i;
    this.elapsed = 0;
    const vs = this.scrollRef.current && this.scrollRef.current.querySelector(`video-slot[data-vid="fmt${n}"]`);
    if (vs && vs.v) { try { vs.v.currentTime = 0; } catch (e) {} }
    this.setState({ story: n });
  }

  camFx() {
    const r = this.scrollRef.current; if (!r) return;
    const H = r.clientHeight || 1;
    [...r.querySelectorAll('[data-screen]')].forEach((sec, i) => {
      const c = Math.max(-1, Math.min(1, (sec.offsetTop - r.scrollTop) / H));
      const cam = sec.firstElementChild, a = Math.abs(c), sx = i % 2 ? 1 : -1;
      cam.style.transform = `perspective(1000px) rotateX(${-c * 24}deg) rotateZ(${c * 5 * sx}deg) scale(${1 - a * 0.14})`;
      cam.style.borderRadius = `${a * 44}px`;
    });
    const scr = Math.round(r.scrollTop / H);
    if (scr !== this.state.scr) { if (scr === 2) this.elapsed = 0; this.setState({ scr }); }
  }

  runIntro() {
    const ov = this.introRef.current; if (!ov) return;
    const soft = 'cubic-bezier(.2,.7,.2,1)', ease = 'cubic-bezier(.7,0,.2,1)';
    const set = (el, st) => el && Object.assign(el.style, st);
    const words = [...this.nameRef.current.children], cut = this.cutRef.current, bg = this.bgRef.current;
    words.forEach((w) => set(w, { display: 'inline-block', transition: 'none', transform: 'translateY(55%)', clipPath: 'inset(0 0 100% 0)', letterSpacing: '0.2em', opacity: '0' }));
    set(cut, { transition: 'none', transform: 'translateY(20%)', opacity: '0' });
    set(bg, { transition: 'none', clipPath: 'inset(100% 0 0 0)' });
    const at = (ms, fn) => window.__assets.then(() => setTimeout(fn, ms));
    at(450, () => set(ov, { transition: `clip-path .8s ${ease}`, clipPath: 'inset(0 0 100% 0)' }));
    at(650, () => set(bg, { transition: `clip-path 1s ${ease}`, clipPath: 'inset(0 0 0 0)' }));
    words.forEach((w, i) => at(800 + i * 170, () => set(w, { transition: `transform 1.1s ${soft}, clip-path 1.1s ${soft}, letter-spacing 1.5s ${soft}, opacity .5s`, transform: 'none', clipPath: 'inset(-10% -10% -25% -10%)', letterSpacing: '-0.035em', opacity: '1' })));
    at(1300, () => set(cut, { transition: `transform 1s ${soft}, opacity .7s`, transform: 'none', opacity: '1' }));
    at(2300, () => set(ov, { display: 'none' }));
  }

  renderVals() {
    const { scr, story, sound } = this.state;
    const F = [
      { t: 'Videoclipes', d: 'lorem ipsum dolor' },
      { t: 'Publicidade', d: 'sit amet consectetur' },
      { t: 'Documentário', d: 'adipiscing elit sed' },
      { t: 'Eventos e casamentos', d: 'do eiusmod tempor' },
      { t: 'Motion e experimental', d: 'incididunt ut labore' },
      { t: 'Redes sociais', d: 'dolore magna aliqua' },
    ];
    const vid = (i) => i === 5 ? 'showreel' : 'fmt-0' + (i + 1);
    const labels = ['capa', 'showreel', 'o que eu filmo', 'sobre', 'contato'];
    const go = (i) => () => { const r = this.scrollRef.current; r && r.scrollTo({ top: i * r.clientHeight, behavior: 'smooth' }); };
    return {
      scrollRef: this.scrollRef, introRef: this.introRef, nameRef: this.nameRef, cutRef: this.cutRef, bgRef: this.bgRef, barsRef: this.barsRef,
      onScroll: () => this.camFx(),
      formatos: F.map((f, i) => ({
        ...f, id: 'fmt-0' + (i + 1), vid: 'fmt' + i, src: scr >= 1 && i <= story + 1 ? 'videos/full/' + vid(i) + '.mp4' : '', ph: f.t.toLowerCase() + ' 9:16',
        op: i === story ? 1 : 0, fill: i < story ? '100%' : '0%',
      })),
      storyNum: String(story + 1).padStart(2, '0'), storyTitle: F[story].t, storyDesc: F[story].d,
      storyDown: (e) => { this.paused = true; this.downAt = performance.now(); this.downX = e.clientX; this.downW = e.currentTarget.getBoundingClientRect(); },
      storyUp: (e) => {
        this.paused = false;

          this.goStory(story + (x < 0.33 ? -1 : 1));

      showHint: scr === 2 && !this.state.hintSeen,

      showSound: scr === 1 || scr === 2,
      soundLabel: sound ? 'desligar som' : 'ligar som', sound, muted: !sound,
      toggleSound: () => this.setState((s) => ({ sound: !s.sound })),

  }
}
</script>
